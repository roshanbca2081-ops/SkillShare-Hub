<!DOCTYPE html>
<html>
<head>
    <title>Register Test</title>
    <style>
        body { font-family: Arial; margin: 40px; background: #f0f0f0; }
        form { background: white; padding: 20px; border-radius: 8px; max-width: 500px; }
        input, select { display: block; width: 100%; margin: 10px 0; padding: 8px; font-size: 14px; }
        button { background: #3b82f6; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .success { color: green; margin: 20px 0; }
        .error { color: red; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Test Registration Form</h1>
    
    <form id="testForm">
        <label>First Name:</label>
        <input type="text" id="fname" value="John" required>
        
        <label>Last Name:</label>
        <input type="text" id="lname" value="Doe" required>
        
        <label>Email:</label>
        <input type="email" id="email" value="john@example.com" required>
        
        <label>Role:</label>
        <select id="role">
            <option value="fresher">Fresher</option>
            <option value="mentor">Mentor</option>
        </select>
        
        <label>Password:</label>
        <input type="password" id="pass" value="password123" required>
        
        <label>Confirm Password:</label>
        <input type="password" id="cpass" value="password123" required>
        
        <button type="button" onclick="testRegister()">Test Registration</button>
    </form>
    
    <div id="result"></div>

    <script>
    function testRegister() {
        const data = {
            firstname: document.getElementById('fname').value,
            lastname: document.getElementById('lname').value,
            email: document.getElementById('email').value,
            role: document.getElementById('role').value,
            password: document.getElementById('pass').value,
            confirm_password: document.getElementById('cpass').value
        };

        console.log('Sending:', data);

        fetch('../api/register.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(r => r.json())
        .then(res => {
            console.log('Response:', res);
            const resultDiv = document.getElementById('result');
            
            if (res.success) {
                resultDiv.innerHTML = '<div class="success">✅ ' + res.message + '</div>';
                console.log('Redirect to:', res.data.redirect);
            } else {
                resultDiv.innerHTML = '<div class="error">❌ ' + res.message + '</div>';
            }
        })
        .catch(err => {
            console.error('Error:', err);
            document.getElementById('result').innerHTML = '<div class="error">❌ Network Error: ' + err.message + '</div>';
        });
    }
    </script>
</body>
</html>
