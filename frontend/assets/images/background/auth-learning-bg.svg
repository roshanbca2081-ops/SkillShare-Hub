<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="25%" stop-color="#16213e"/>
      <stop offset="50%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="blur30">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="blur12">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Learning icon: Graduation cap -->
  <g filter="url(#blur30)" opacity="0.85">
    <circle cx="300" cy="220" r="140" fill="#3b82f6" opacity="0.35"/>
    <text x="300" y="280" font-family="FontAwesome, Arial" font-size="120" text-anchor="middle" fill="#ffffff" opacity="0.5">&#61599;</text>
  </g>

  <!-- Learning icon: Book -->
  <g filter="url(#blur30)" opacity="0.85">
    <circle cx="1350" cy="180" r="150" fill="#8b5cf6" opacity="0.35"/>
    <text x="1350" y="240" font-family="FontAwesome, Arial" font-size="130" text-anchor="middle" fill="#ffffff" opacity="0.5">&#61693;</text>
  </g>

  <!-- Learning icon: Laptop / code -->
  <g filter="url(#blur30)" opacity="0.85">
    <circle cx="200" cy="700" r="130" fill="#06b6d4" opacity="0.30"/>
    <text x="200" y="760" font-family="FontAwesome, Arial" font-size="110" text-anchor="middle" fill="#ffffff" opacity="0.5">&#61817;</text>
  </g>

  <!-- Learning icon: Microscope / research -->
  <g filter="url(#blur30)" opacity="0.85">
    <circle cx="1450" cy="650" r="150" fill="#22c55e" opacity="0.30"/>
    <text x="1450" y="710" font-family="FontAwesome, Arial" font-size="120" text-anchor="middle" fill="#ffffff" opacity="0.5">&#62105;</text>
  </g>

  <!-- Learning icon: Pencil (writing) -->
  <g filter="url(#blur30)" opacity="0.85">
    <circle cx="850" cy="120" r="120" fill="#fd79a8" opacity="0.30"/>
    <text x="850" y="180" font-family="FontAwesome, Arial" font-size="100" text-anchor="middle" fill="#ffffff" opacity="0.5">&#61595;</text>
  </g>

  <!-- Floating secondary shapes -->
  <g filter="url(#blur12)" opacity="0.5">
    <text x="550" cy="0" y="820" font-family="FontAwesome, Arial" font-size="70" fill="#60a5fa">&#61599;</text>
    <text x="1050" y="300" font-family="FontAwesome, Arial" font-size="60" fill="#a78bfa">&#61693;</text>
    <text x="700" y="500" font-family="FontAwesome, Arial" font-size="55" fill="#22d3ee">&#62149;</text>
    <text x="1200" y="820" font-family="FontAwesome, Arial" font-size="65" fill="#34d399">&#61639;</text>
  </g>

  <!-- Soft radial glows -->
  <circle cx="400" cy="500" r="400" fill="#3b82f6" opacity="0.08" filter="url(#blur30)"/>
  <circle cx="1200" cy="400" r="400" fill="#8b5cf6" opacity="0.08" filter="url(#blur30)"/>
</svg>
